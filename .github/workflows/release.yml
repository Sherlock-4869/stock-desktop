name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: latest
        type: choice
        options: [latest, beta]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CHANNEL: ${{ inputs.channel || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          fi
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never --config.publish.channel="$CHANNEL"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WIN_CSC_LINK) {
            $env:CSC_LINK = $env:WIN_CSC_LINK
            $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
          }
          npx electron-builder --win nsis --x64 --publish never --config.publish.channel="$env:CHANNEL"
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml

  release:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stock Watch ${{ github.ref_name }}
          draft: false
          prerelease: ${{ inputs.channel == 'beta' }}
          generate_release_notes: true
          files: release-assets/**/*
